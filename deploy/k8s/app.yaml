# Self-hosting on a Kubernetes cluster (see docs/hosting.md). Replace bh.example.org with your subdomain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bestvina-handel
spec:
  replicas: 1
  selector:
    matchLabels: { app: bestvina-handel }
  template:
    metadata:
      labels: { app: bestvina-handel }
    spec:
      containers:
        - name: web
          image: ghcr.io/johannes-heissler/bestvina-handel-web:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: bestvina-handel
spec:
  selector: { app: bestvina-handel }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bestvina-handel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [bh.example.org]
      secretName: bestvina-handel-tls
  rules:
    - host: bh.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: bestvina-handel, port: { number: 80 } }
